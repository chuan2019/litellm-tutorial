name: litellm-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?export POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]                       # no published port: nothing outside can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?export REDIS_PASSWORD}"]
    networks: [backend]

  upstream:                                   # stand-in for the LLM provider
    image: ghcr.io/berriai/litellm-non_root:v1.109.1
    entrypoint: ["python", "/srv/echo_upstream.py", "4012", "0.0.0.0"]
    volumes: [../echo_upstream.py:/srv/echo_upstream.py:ro]
    networks: [backend]

  proxy:
    image: ghcr.io/berriai/litellm-non_root:v1.109.1   # runs as uid 65534, not root
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    deploy:
      replicas: 2
    volumes: [./prod_config.yaml:/app/config.yaml:ro]
    environment:
      LITELLM_MODE: PRODUCTION                # do not read a .env file from the working directory
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?export LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?export LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/litellm
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-upstream-demo}
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"
      DISABLE_ADMIN_UI: "True"
      LITELLM_CORS_ORIGINS: https://chat.example.com
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend, edge]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 5s
      retries: 30

  nginx:
    image: nginx:1.27.5-alpine
    ports: ["127.0.0.1:8443:443"]             # the only published port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]
    depends_on:
      proxy: {condition: service_healthy}

networks:
  backend:
    internal: true                            # no route to the internet from db, redis, upstream
  edge:
    ipam:
      config: [{subnet: 10.89.0.0/24}]        # matches trusted_proxy_ranges in prod_config.yaml

volumes:
  pgdata:
