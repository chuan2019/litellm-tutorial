[project]
name = "litellm-tutorial"
version = "0.2.0"
description = "Runnable examples and notebooks for the LiteLLM tutorial"
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy,extra_proxy]==1.110.2",
    "openai==3.50.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "pydantic==2.14.3",
]

[dependency-groups]
notebooks = [
    "python-dotenv==1.2.4",
    "jupyterlab==4.6.5",
    "ipykernel==7.4.0",
    "pandas==3.1.0",
    "boto3==1.44.3",
    "botocore[crt]==1.44.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
