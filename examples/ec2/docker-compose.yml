name: litellm-ec2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make_env.sh first}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  proxy:
    image: ghcr.io/berriai/litellm:v1.110.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"   # the SSM port-forward reaches it; nothing else can
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run make_env.sh first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run make_env.sh first}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?run make_env.sh first}@db:5432/litellm
      AWS_REGION: ${BEDROCK_REGION:-us-west-2}   # the Bedrock region, not the instance's
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
