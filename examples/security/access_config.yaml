model_list:
  - model_name: chat
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      mock_response: "Hi from Claude"
  - model_name: chat-cheap
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      mock_response: "Hi from GPT-4o mini"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # admin credential; never hand it to an app
  database_url: os.environ/DATABASE_URL          # virtual keys, users, teams
  # LITELLM_SALT_KEY (env only) encrypts provider credentials stored in the database
